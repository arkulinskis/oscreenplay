<article class="ui-item sk-vault-item">

    <anvil-component type="Label" name="text" prop:role='["item-body"]'></anvil-component>
    <anvil-component type="Label" name="when" prop:role='["fine-print"]'></anvil-component>
  </div>
  <div class="acts">
    <anvil-component type="Button" name="reopen" prop:text="Reopen" prop:role='["btn", "btn-sm", "ic-refresh"]'></anvil-component>
    <anvil-component type="Button" name="develop" prop:text="Develop" prop:role='["btn", "btn-sm", "ic-arrow"]'></anvil-component>
    <anvil-component type="Button" name="delete" prop:text="" prop:role='["btn", "btn-sm", "btn-ghost", "btn-danger", "ic-trash"]'></anvil-component>
  </div>
</article>
