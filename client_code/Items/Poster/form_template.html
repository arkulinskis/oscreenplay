<div class="ps-host">
  <a class="os-poster" anvil:name="card" href="#home">
    <span class="segs" anvil:dom-node="segs" aria-hidden="true"></span>
    <anvil-component type="Label" name="gen" prop:role='["ps-gen"]'></anvil-component>
    <span class="ui-badge ps-sample" anvil:name="sample">Sample</span>
    <anvil-component type="Label" name="title" prop:role='["ps-title"]'></anvil-component>
    <anvil-component type="Label" name="line" prop:role='["ps-line"]'></anvil-component>
    <anvil-component type="Label" name="meta" prop:role='["ps-meta"]'></anvil-component>
  </a>
  <button type="button" class="os-poster new" anvil:name="new_tile" anvil:on-dom:click="self.new_click"><i class="ic ic-plus"></i><b>New screenplay</b><span class="small">Empty, by beats, or from a spark</span></button>
</div>
