<div class="ui np-dialog">
  <h2 class="dlg-h">New screenplay</h2>
  <p class="muted">Every choice can change later. Not sure? Story Circle and a feature are a great start.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Working title</span><anvil-component type="TextBox" name="title_box" prop:placeholder="Untitled screenplay"></anvil-component></label>
    <div class="ui-grid two">
      <label class="ui-field"><span>Format</span><anvil-component type="DropDown" name="format_box"></anvil-component></label>
      <label class="ui-field"><span>Genre</span><anvil-component type="DropDown" name="genre_box"></anvil-component></label>
    </div>
    <div><span class="np-field-label" id="np-struct-l">Structure</span><div role="group" aria-labelledby="np-struct-l"><anvil-component type="RepeatingPanel" name="structs_panel" prop:item_template="OScreenplay.Items.Choice" prop:role='["np-structs"]'></anvil-component></div></div>
    <div><span class="np-field-label" id="np-start-l">Start with</span><div role="group" aria-labelledby="np-start-l"><anvil-component type="RepeatingPanel" name="starts_panel" prop:item_template="OScreenplay.Items.Choice" prop:role='["np-start"]'></anvil-component></div></div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end"><anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component><anvil-component type="Button" name="create_button" prop:text="Create" prop:role='["btn", "btn-primary", "ic-arrow"]'></anvil-component></div>
  </div>
</div>
